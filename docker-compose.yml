services:
  postgres:
    image: postgres:17-alpine
    container_name: nest-postgres
    profiles: ['full']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nest}
      POSTGRES_DB: ${AUTH_POSTGRES_DATABASE:-nest_auth}
      USER_POSTGRES_DATABASE: ${USER_POSTGRES_DATABASE:-nest_users}
      CHAT_POSTGRES_DATABASE: ${CHAT_POSTGRES_DATABASE:-nest_chat}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    command:
      [
        'postgres',
        '-c',
        'max_connections=200',
        '-c',
        'shared_buffers=128MB',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nest-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nest}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nest-redis
    profiles: ['full']
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
